<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 🔥 THEME FOUC FIX -->
  <script>
    (function () {
      const savedTheme = localStorage.getItem('meditrack_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <title>Login - MediTrack Hospital Management</title>

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <style>
    body.login-body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b, #0ea5e9);
      background-size: 400% 400%;
      animation: shimmer 15s ease infinite;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      padding: 40px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--primary-500), var(--secondary-500));
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 32px;
      box-shadow: 0 8px 24px rgba(14, 165, 233, 0.4);
    }

    @keyframes shimmer {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }
  </style>
</head>

<body class="login-body">

  <div class="glass-card login-container animate-fade-in">
    <div class="login-header">
      <div class="login-logo">
        <i class="bx bx-plus-medical"></i>
      </div>
      <h2 style="font-size: 24px; font-weight: 800; color: var(--text-main);">Medi<span
          style="color: var(--primary-500);">Track</span> Portal</h2>
      <p style="font-size: 14px; color: var(--text-muted); margin-top: 4px;">Hospital Internship &amp; Training System
      </p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="login-email">Email Address</label>
        <div class="search-box">
          <i class="bx bx-envelope search-icon"></i>
          <input type="email" id="login-email" class="form-control" placeholder="name@hospital.com" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <div class="search-box">
          <i class="bx bx-lock-alt search-icon"></i>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px; padding: 12px;">
        <i class="bx bx-log-in-circle"></i> Sign In to Portal
      </button>
    </form>

    <!-- 🔥 Sign Up Link -->
    <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px dashed var(--border-color);">
      <p style="font-size: 14px; color: var(--text-muted);">
        Don't have an account?
        <a href="signup.html" style="color: var(--primary-500); font-weight: 700; text-decoration: none;">Sign Up</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { auth } from "./assets/js/auth.js";

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;

      const btn = e.target.querySelector('button[type="submit"]');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="bx bx-loader bx-spin"></i> Signing In...';

      try {
        await auth.login(email, password);
        window.location.href = "dashboard.html";
      } catch (error) {
        btn.disabled = false;
        btn.innerHTML = originalText;

        let msg = "Login Failed";
        if (error.code === "auth/user-not-found") msg = "No account found with this email.";
        else if (error.code === "auth/wrong-password") msg = "Incorrect password.";
        else if (error.code === "auth/invalid-email") msg = "Invalid email address.";
        else if (error.code === "auth/invalid-credential") msg = "Invalid email or password.";
        else msg = error.message;

        alert(msg);
      }
    });
  </script>

</body>

</html>
