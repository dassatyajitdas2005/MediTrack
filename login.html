<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      const savedTheme = localStorage.getItem('meditrack_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
  <title>Login - MediTrack Hospital Management</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <style>
    body.login-body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b, #0ea5e9);
      background-size: 400% 400%;
      animation: shimmer 15s ease infinite;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      padding: 40px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--primary-500), var(--secondary-500));
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 32px;
      box-shadow: 0 8px 24px rgba(14, 165, 233, 0.4);
    }

    @keyframes shimmer {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
      z-index: 2;
    }

    .toggle-password:hover {
      color: var(--text-main);
    }
  </style>
</head>

<body class="login-body">

  <!-- EmailJS CDN -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <div class="glass-card login-container animate-fade-in">

    <div class="login-header">
      <div class="login-logo">
        <i class="bx bx-plus-medical"></i>
      </div>
      <h2 style="font-size: 24px; font-weight: 800; color: var(--text-main);">
        Medi<span style="color: var(--primary-500);">Track</span> Portal
      </h2>
      <p style="font-size: 14px; color: var(--text-muted); margin-top: 4px;">
        Hospital Internship &amp; Training System
      </p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="login-email">Email Address</label>
        <div class="search-box">
          <i class="bx bx-envelope search-icon"></i>
          <input type="email" id="login-email" class="form-control" placeholder="name@hospital.com" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <div class="search-box password-wrapper">
          <i class="bx bx-lock-alt search-icon"></i>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
          <button type="button" class="toggle-password" id="toggle-login-pass" tabindex="-1">
            <i class="bx bx-hide"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" id="login-btn"
        style="width: 100%; margin-top: 12px; padding: 12px;">
        <i class="bx bx-log-in-circle"></i> Sign In to Portal
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px dashed var(--border-color);">
      <p style="font-size: 14px; color: var(--text-muted);">
        Don't have an account?
        <a href="signup.html" style="color: var(--primary-500); font-weight: 700; text-decoration: none;">Sign Up</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { auth } from "./assets/js/auth.js";

    const passInput = document.getElementById('login-password');
    const toggleBtn = document.getElementById('toggle-login-pass');
    toggleBtn.addEventListener('click', () => {
      const icon = toggleBtn.querySelector('i');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        icon.classList.remove('bx-hide');
        icon.classList.add('bx-show');
      } else {
        passInput.type = 'password';
        icon.classList.remove('bx-show');
        icon.classList.add('bx-hide');
      }
    });

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      const btn = document.getElementById("login-btn");

      btn.disabled = true;
      btn.innerHTML = '<i class="bx bx-loader bx-spin"></i> Signing In...';

      try {
        const result = await auth.login(email, password);

        if (result.needsVerification) {
          alert("Please verify your email. OTP sent!");
          window.location.href = "verify-otp.html";
          return;
        }

        window.location.href = "dashboard.html";
      } catch (error) {
        btn.disabled = false;
        btn.innerHTML = '<i class="bx bx-log-in-circle"></i> Sign In to Portal';

        const map = {
          "auth/invalid-email": "Invalid email address.",
          "auth/user-not-found": "No account found with this email.",
          "auth/wrong-password": "Incorrect password.",
          "auth/invalid-credential": "Invalid email or password.",
          "auth/user-disabled": "This account has been disabled.",
          "auth/too-many-requests": "Too many attempts. Please wait."
        };
        alert(map[error.code] || error.message);
      }
    });
  </script>

</body>

</html>
