<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
    (function () {
      const savedTheme = localStorage.getItem('meditrack_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <title>Daily Schedule - MediTrack</title>

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>

<body>
  <div class="app-container">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <div id="navbar-container"></div>

      <main class="page-content animate-fade-in">

        <div class="page-header" style="margin-bottom:24px;">
          <h2 style="font-size:24px; font-weight:800;">Daily Training Schedule</h2>
          <p style="color:var(--text-muted); font-size:14px;">Your daily tasks and department assignments.</p>
        </div>

        <!-- Student Schedule Tasks -->
        <div id="schedule-container">
          <p style="color:var(--text-muted); text-align:center; padding:40px;">Loading schedule...</p>
        </div>

        <!-- Additional Training from Firestore -->
        <div id="extra-training" style="margin-top:24px;"></div>

      </main>
    </div>
  </div>

  <script type="module" src="assets/js/schedule.js"></script>
</body>

</html>
