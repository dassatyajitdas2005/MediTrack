<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0ea5e9" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Logo Emblem -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#medGrad)" filter="url(#shadow)" />
    <!-- Heartbeat & Medical Cross -->
    <path d="M50 25 V75 M25 50 H75" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.25" />
    <path d="M 22 52 L 35 52 L 42 35 L 50 68 L 58 42 L 65 52 L 78 52" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- Brand Text -->
  <text x="128" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="40" fill="#0f172a" class="brand-title">Medi<tspan fill="url(#medGrad)">Track</tspan></text>
  <text x="130" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#64748b" letter-spacing="2">HOSPITAL INTERNSHIP &amp; TRAINING</text>
</svg>
