<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Module - MediTrack</title>

  <script>
    (function () {
      const savedTheme = localStorage.getItem('meditrack_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <style>
    /* Toast - Top Right */
    .toast {
      position: fixed;
      top: 24px;
      right: 24px;
      padding: 14px 20px;
      border-radius: var(--radius-md);
      color: white;
      font-weight: 700;
      z-index: 9999;
      transform: translateY(-100px);
      opacity: 0;
      transition: all 0.4s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow-lg);
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast-success {
      background: var(--accent-emerald);
    }

    .toast-error {
      background: var(--accent-rose);
    }

    /* Attendance Select */
    .attendance-select {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-main);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
      min-width: 120px;
    }

    .attendance-select:focus {
      border-color: var(--primary-500);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status-present {
      background: rgba(16, 185, 129, 0.15);
      color: #059669;
    }

    .status-absent {
      background: rgba(239, 68, 68, 0.15);
      color: #dc2626;
    }

    /* Stats Bar */
    .stats-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 14px 20px;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stat-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .stat-present .stat-icon {
      background: rgba(16, 185, 129, 0.12);
      color: #059669;
    }

    .stat-absent .stat-icon {
      background: rgba(239, 68, 68, 0.12);
      color: #dc2626;
    }

    .stat-total .stat-icon {
      background: rgba(14, 165, 233, 0.12);
      color: var(--primary-500);
    }

    .stat-info {
      display: flex;
      flex-direction: column;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
      color: var(--text-main);
    }

    .stat-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-divider {
      width: 1px;
      height: 28px;
      background: var(--border-color);
    }

    /* Remarks */
    .remarks-input {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-main);
      color: var(--text-main);
      font-size: 12px;
      width: 140px;
      outline: none;
    }

    .remarks-input:focus {
      border-color: var(--primary-500);
    }

    /* Skeleton */
    .skeleton {
      background: linear-gradient(90deg, var(--bg-main) 25%, var(--bg-surface) 50%, var(--bg-main) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 6px;
      height: 16px;
    }

    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }

      100% {
        background-position: 200% 0;
      }
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state i {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }
  </style>
</head>

<body>
  <div class="app-container">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <div id="navbar-container"></div>

      <main class="page-content animate-fade-in">
      <!-- Date Selector & Control Bar -->
      <div class="glass-card" style="padding: 20px; margin-bottom: 24px;">
        <div
          style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 16px;">
          <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
            <div style="display: flex; align-items: center; gap: 10px;">
              <i class="bx bx-calendar" style="font-size: 20px; color: var(--primary-500);"></i>
              <label class="form-label" style="margin-bottom: 0; font-weight: 700;">Select Date:</label>
              <input type="date" id="attendance-date-picker" class="form-control" style="width: 180px;">
            </div>
          </div>
          <button id="save-attendance-btn" class="btn btn-success" style="display: none;">
            <i class="bx bx-check-double"></i> Save Attendance
          </button>
        </div>

        <!-- Stats Bar -->
        <div class="stats-bar" id="stats-bar" style="display: none;">
          <div class="stat-item stat-present">
            <div class="stat-icon"><i class="bx bx-check-circle"></i></div>
            <div class="stat-info">
              <span class="stat-value" id="stat-present">0</span>
              <span class="stat-label">Present</span>
            </div>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item stat-absent">
            <div class="stat-icon"><i class="bx bx-x-circle"></i></div>
            <div class="stat-info">
              <span class="stat-value" id="stat-absent">0</span>
              <span class="stat-label">Absent</span>
            </div>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item stat-total">
            <div class="stat-icon"><i class="bx bx-group"></i></div>
            <div class="stat-info">
              <span class="stat-value" id="stat-total">0</span>
              <span class="stat-label">Total Interns</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Attendance Table -->
      <div class="glass-card" style="padding: 24px;">
        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>Intern ID</th>
                <th>Student & College</th>
                <th>Department</th>
                <th>Attendance Status</th>
                <th>Remarks</th>
                <th>Overall Attendance %</th>
              </tr>
            </thead>
            <tbody id="attendance-tbody">
              <tr>
                <td colspan="6" style="padding: 40px;">
                  <div style="display: flex; flex-direction: column; gap: 12px;">
                    <div class="skeleton" style="width: 100%; height: 40px;"></div>
                    <div class="skeleton" style="width: 100%; height: 40px;"></div>
                    <div class="skeleton" style="width: 100%; height: 40px;"></div>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
          <div id="empty-state" class="empty-state" style="display: none;">
            <i class="bx bx-calendar-x"></i>
            <h3>No interns found</h3>
            <p>Add interns from Intern Management to start marking attendance.</p>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

  <div id="toast" class="toast"></div>

  <script type="module" src="assets/js/attendance.js"></script>

</body>

</html>
