<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - MediTrack</title>

    <script>
        (function () {
            const savedTheme = localStorage.getItem('meditrack_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <style>
        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            padding: 14px 20px;
            border-radius: var(--radius-md);
            color: white;
            font-weight: 700;
            z-index: 9999;
            transform: translateY(-100px);
            opacity: 0;
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow-lg);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast-success {
            background: var(--accent-emerald);
        }

        .toast-error {
            background: var(--accent-rose);
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .action-btns button {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-md);
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }

        .btn-edit {
            background: rgba(14, 165, 233, 0.12);
            color: var(--primary-500);
        }

        .btn-edit:hover {
            background: var(--primary-500);
            color: white;
        }

        .btn-delete {
            background: rgba(244, 63, 94, 0.12);
            color: var(--accent-rose);
        }

        .btn-delete:hover {
            background: var(--accent-rose);
            color: white;
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 700;
            text-transform: capitalize;
        }

        .role-admin {
            background: rgba(244, 63, 94, 0.15);
            color: #fb7185;
        }

        .role-student {
            background: rgba(14, 165, 233, 0.15);
            color: #38bdf8;
        }

        .role-supervisor {
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
        }

        .role-staff {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-active {
            background: var(--accent-emerald);
        }

        .status-inactive {
            background: var(--accent-rose);
        }

        .status-pending {
            background: var(--accent-amber);
        }

        .skeleton {
            background: linear-gradient(90deg, var(--bg-main) 25%, var(--bg-surface) 50%, var(--bg-main) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
            height: 16px;
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }

            100% {
                background-position: 200% 0;
            }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .form-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 640px) {
            .form-grid-2 {
                grid-template-columns: 1fr;
            }
        }

        .user-avatar-sm {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-500), var(--secondary-500));
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: white;
            margin-right: 12px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <div class="main-wrapper">
            <div id="navbar-container"></div>

            <main class="page-content animate-fade-in">
            <!-- Header & Filters -->
            <div class="glass-card" style="padding: 20px; margin-bottom: 24px;">
                <div
                    style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px;">
                    <div style="display: flex; gap: 16px; flex: 1; min-width: 280px; align-items: center;">
                        <div class="search-box" style="flex: 1;">
                            <i class="bx bx-search search-icon"></i>
                            <input type="text" id="user-search-input" class="form-control"
                                placeholder="Search by Name or Email...">
                        </div>
                        <select id="user-role-filter" class="form-control" style="width: 180px;">
                            <option value="">All Roles</option>
                            <option value="admin">Admin</option>
                            <option value="student">Student</option>
                            <option value="supervisor">Supervisor</option>
                            <option value="staff">Staff</option>
                        </select>
                    </div>
                    <button id="add-user-btn" class="btn btn-primary">
                        <i class="bx bx-plus"></i> Add User
                    </button>
                </div>
            </div>

            <!-- Table -->
            <div class="glass-card" style="padding: 24px;">
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Department</th>
                                <th>Phone</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="user-tbody">
                            <tr>
                                <td colspan="7" style="padding: 40px;">
                                    <div style="display: flex; flex-direction: column; gap: 12px;">
                                        <div class="skeleton" style="width: 100%; height: 40px;"></div>
                                        <div class="skeleton" style="width: 100%; height: 40px;"></div>
                                        <div class="skeleton" style="width: 100%; height: 40px;"></div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div id="empty-state" class="empty-state" style="display: none;">
                        <i class="bx bx-user-x"></i>
                        <h3>No users found</h3>
                        <p>Add a new user to get started.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ===== ADD/EDIT MODAL ===== -->
    <div class="modal-overlay" id="user-modal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modal-title"><i class="bx bx-user-plus"></i> Add New User</h3>
                <button class="modal-close-btn" id="close-user-modal"><i class="bx bx-x"></i></button>
            </div>
            <form id="user-form">
                <div class="modal-body">
                    <input type="hidden" id="user-edit-id">
                    <div class="form-grid-2">
                        <div class="form-group">
                            <label class="form-label">Full Name *</label>
                            <input type="text" id="user-name" class="form-control" required
                                placeholder="e.g. Dr. Rajesh Khanna">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Email Address *</label>
                            <input type="email" id="user-email" class="form-control" required
                                placeholder="user@meditrack.com">
                        </div>
                    </div>
                    <div class="form-grid-2">
                        <div class="form-group">
                            <label class="form-label">Role *</label>
                            <select id="user-role" class="form-control" required>
                                <option value="student">Student</option>
                                <option value="admin">Admin</option>
                                <option value="supervisor">Supervisor</option>
                                <option value="staff">Staff</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Department</label>
                            <select id="user-department" class="form-control">
                                <option value="">Select Department</option>
                                <option value="Pharmacy">Pharmacy</option>
                                <option value="OPD Store">OPD Store</option>
                                <option value="General Surgery">General Surgery</option>
                                <option value="Pathology Lab">Pathology Lab</option>
                                <option value="Physiotherapy OPD">Physiotherapy OPD</option>
                                <option value="Outdoor">Outdoor</option>
                                <option value="Indoor">Indoor</option>
                                <option value="Emergency Ward">Emergency Ward</option>
                                <option value="General Medicine">General Medicine</option>
                                <option value="Medicine">Medicine</option>
                                <option value="ENT">ENT</option>
                                <option value="Pediatrics">Pediatrics</option>
                                <option value="Orthopedics">Orthopedics</option>
                                <option value="Dermatology">Dermatology</option>
                                <option value="Dental">Dental</option>
                                <option value="Gynecology">Gynecology</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-grid-2">
                        <div class="form-group">
                            <label class="form-label">Phone Number</label>
                            <input type="tel" id="user-phone" class="form-control" placeholder="+91 98765 43210">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Status</label>
                            <select id="user-status" class="form-control">
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                                <option value="pending">Pending</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancel-user-modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="save-user-btn">
                        <i class="bx bx-save"></i> <span id="save-btn-text">Save User</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Modal -->
    <div class="modal-overlay" id="delete-modal">
        <div class="modal-container" style="max-width: 400px;">
            <div class="modal-header">
                <h3><i class="bx bx-trash"></i> Confirm Delete</h3>
                <button class="modal-close-btn" id="close-delete-modal"><i class="bx bx-x"></i></button>
            </div>
            <div class="modal-body" style="text-align: center;">
                <i class="bx bx-error-circle" style="font-size: 48px; color: var(--accent-rose);"></i>
                <p style="margin-top: 16px; font-weight: 700; color: var(--text-main);">Delete this user?</p>
                <p style="font-size: 13px; color: var(--text-muted);">This action cannot be undone.</p>
            </div>
            <div class="modal-footer" style="justify-content: center;">
                <button type="button" class="btn btn-secondary" id="cancel-delete">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirm-delete">
                    <i class="bx bx-trash"></i> Delete
                </button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module" src="assets/js/user.js"></script>
</body>

</html>
