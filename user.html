<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - MediTrack</title>

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/components.css">

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>

<body>

    <div class="app-container">

        <div id="sidebar-container"></div>

        <div class="main-wrapper">

            <div id="navbar-container"></div>

            <main class="page-content animate-fade-in">

                <!-- Top Controls -->
                <div class="glass-card"
                    style="padding:20px; margin-bottom:24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">

                    <div class="search-box" style="flex:1; min-width:250px;">
                        <i class="bx bx-search search-icon"></i>
                        <input type="text" id="user-search" class="form-control"
                            placeholder="Search by Name or Email...">
                    </div>

                    <select id="role-filter" class="form-control" style="width:200px;">
                        <option value="">All Roles</option>
                        <option value="admin">Admin</option>
                        <option value="student">Student</option>
                        <option value="supervisor">Supervisor</option>
                    </select>

                    <button class="btn btn-primary" id="add-user-btn">
                        <i class="bx bx-user-plus"></i>
                        Add User
                    </button>

                </div>

                <!-- User Table -->
                <div class="glass-card">

                    <div class="table-container">

                        <table class="data-table">

                            <thead>

                                <tr>

                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Department</th>
                                    <th>Actions</th>

                                </tr>

                            </thead>

                            <tbody id="users-table-body">

                            </tbody>

                        </table>

                    </div>

                </div>

                <!-- ========================= -->
                <!-- Add User Modal -->
                <!-- ========================= -->

                <div class="modal-overlay" id="user-modal">

                    <div class="modal-container">

                        <div class="modal-header">

                            <h3>Add New User</h3>

                            <button id="close-modal" class="modal-close-btn">
                                <i class="bx bx-x"></i>
                            </button>

                        </div>

                        <!-- FORM START -->
                        <form id="user-form">

                            <div class="modal-body">

                                <div class="form-group">

                                    <label>Name</label>

                                    <input type="text" id="user-name" class="form-control" required>

                                </div>

                                <div class="form-group">

                                    <label>Email</label>

                                    <input type="email" id="user-email" class="form-control" required>

                                </div>

                                <div class="form-group">

                                    <label>Password</label>

                                    <input type="password" id="user-password" class="form-control" minlength="6"
                                        required>

                                </div>

                                <div class="form-group">

                                    <label>Role</label>

                                    <select id="user-role" class="form-control">

                                        <option value="student">Student</option>
                                        <option value="admin">Admin</option>
                                        <option value="supervisor">Supervisor</option>

                                    </select>

                                </div>

                            </div>

                            <div class="modal-footer">

                                <button type="button" class="btn btn-secondary" id="cancel-user">

                                    Cancel

                                </button>

                                <button type="submit" class="btn btn-primary">

                                    Create User

                                </button>

                            </div>

                        </form>
                        <!-- FORM END -->

                    </div>

                </div>

            </main>

        </div>

    </div>

    <script type="module" src="assets/js/user.js"></script>

</body>

</html>
